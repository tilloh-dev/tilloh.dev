# CI from the tide template (D-004, D-006).
#
# The only required check in the branch rule is `gate`. It depends on all jobs
# and fails explicitly if one did not succeed: GitHub treats skipped required
# checks as passed.
#
# Actions are pinned by commit SHA; Renovate keeps the pins current (D-028).
#
# Deliberate deviations (see AGENTS.md):
#   - no e2e job: E2E tests need MongoDB and run locally only
#   - changelog job: every PR updates CHANGELOG.md
#   - audit checks production dependencies only
#
# Removing a job means removing it from `needs` of `gate`, too.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only critical vulnerabilities turn the gate red (D-006).
      # Deliberate deviation: production dependencies only (see AGENTS.md).
      - run: pnpm audit --prod --audit-level=critical

  fs-scan:
    name: filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Backend image only: Frontend.Dockerfile references the missing
  # frontend/config-template.json and does not build.
  image-scan:
    name: image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./backend build
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Backend.Dockerfile
          push: false
          load: true
          tags: backend:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Every PR updates CHANGELOG.md. Pushes to main and Renovate PRs pass.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: CHANGELOG.md updated?
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!files.some((file) => file.filename === 'CHANGELOG.md')) {
              core.setFailed('CHANGELOG.md was not updated. Add an entry under [Unreleased].');
            }

  gate:
    name: gate
    needs: [checks, audit, fs-scan, image-scan, changelog]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: All jobs successful?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "At least one job did not succeed ($r). Gate stays red." >&2
              exit 1
            fi
          done
