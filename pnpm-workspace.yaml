packages:
  - frontend
  - backend
  - e2e

minimumReleaseAge: 1440   # minutes: new versions only after one day
allowBuilds:              # install scripts only for these packages
  '@swc/core': true       # native binary for the backend build
  esbuild: true           # native binary for vite
  nx: true                # native nx binaries
  '@nestjs/core': false  # funding message only
  '@parcel/watcher': false
  '@scarf/scarf': false   # telemetry
  carbon-components-svelte: false
  core-js-pure: false
  less: false
  svelte-preprocess: false
  unrs-resolver: false

# Security fixes for transitive dependencies; mirrored in backend/package.json
# "overrides" for the npm install on Uberspace and in the image.
overrides:
  fastify: ^5.12.5            # @nestjs/platform-fastify 11 pins 5.11.3
  '@fastify/busboy': ^3.2.2   # fastify-multer still requires ^1
